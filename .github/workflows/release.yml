name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        # Framework-dependent, not self-contained: the exe stays under
        # 1 MB instead of ~115 MB, at the cost of requiring the .NET 10
        # Desktop Runtime already installed on the target machine.
        # -p:SelfContained=false, not --self-contained false — the CLI
        # switch silently didn't take effect (still produced a
        # self-contained exe) as of the SDK version pinned above.
        run: >
          dotnet publish WslClipboardBridge.csproj
          -c Release
          -r win-x64
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WslClipboardBridge-win-x64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: WslClipboardBridge-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
